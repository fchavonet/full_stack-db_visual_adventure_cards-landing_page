<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DBVAC - Manage your Dragon Ball Visual Adventure card collection</title>
    <meta name="description" content="Manage your Dragon Ball Visual Adventure card collection, see which cards you're missing and track your progress, right from your iPhone.">
    <!-- FAVICON -->
    <link rel="icon" href="./assets/favicon.ico" type="image/x-icon">

    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- DAISYUI -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5" type="text/css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- SCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js" defer></script>
    <script src="./script.js" defer></script>
</head>

<body class="max-w-6xl min-h-svh mx-auto p-4 flex flex-col antialiased">
    <!-- HEADER -->
    <header class="pb-4 flex flex-row justify-between items-center">
        <!-- -->
        <a class="flex flex-row justify-center items-center gap-2" href="#">
            <img class="w-10 h-10" src="./assets/images/logo-dbvac.webp" alt="DBVAC">
            <span class="font-black text-2xl tracking-tighter">DBVAC</span>
        </a>

        <!-- -->
        <div class="flex flex-row justify-center items-center gap-2">
            <label class="btn btn-circle swap">
                <input id="language-toggle" type="checkbox" aria-label="Switch language">
                <span class="swap-on text-[#ff8d28]" lang="en">EN</span>
                <span class="swap-off text-[#ff8d28]" lang="fr">FR</span>
            </label>

            <label class="btn btn-circle swap swap-rotate">
                <input id="theme-toggle" class="theme-controller" type="checkbox" value="dark" aria-label="Switch theme">
                <i class="swap-on bi bi-brightness-high-fill text-[#ff8d28]"></i>
                <i class="swap-off bi bi-moon-stars-fill text-[#ff8d28]"></i>
            </label>
        </div>
    </header>

    <!-- MAIN -->
    <main class="flex flex-1 flex-col justify-center items-center text-center">
        <h1 class="">Dragon Ball Visual Adventure Cards</h1>
        <h2 class="" data-i18n="heading2">Manage your card collection on your iPhone.</h2>
    </main>

    <!-- FOOTER -->
    <footer class="flex flex-col md:flex-row justify-center md:justify-between items-center gap-4">
        <div class="flex flex-row justify-center items-center gap-4">
            <button type="button" class="decoration-1 hover:underline underline-offset-4 cursor-pointer " onclick="openMarkdownModal('privacy')" data-i18n="privacy">
                Privacy
            </button>

            <span>•</span>

            <button type="button" class="decoration-1 hover:underline underline-offset-4 cursor-pointer" onclick="openMarkdownModal('support')" data-i18n="support">
                Support
            </button>
        </div>

        <div class="flex flex-col md:flex-row justify-center items-center text-center">
            <p>© <span id="year">20..</span> <a class="decoration-1 underline-offset-4 hover:underline" href="https://fchavonet.dev/" target="_blank">Fabien Chavonet</a></p>
            <span class="hidden md:block">&nbsp;-&nbsp;</span>
            <p data-i18n="copyright">Unofficial application, not affiliated with Bandai.</p>
        </div>
    </footer>

    <!-- PRIVACY MODAL -->
    <dialog id="privacy-modal" class="modal">
        <div class="modal-box">
            <!-- Close button -->
            <form method="dialog">
                <button type="submit" class="btn btn-sm btn-circle absolute right-2 top-2" aria-label="Close">
                    <i class="bi bi-x-lg text-[#ff8d28]"></i>
                </button>
            </form>

            <!-- PRIVACY CONTENT -->
            <div id="privacy-content" class="[&_h1]:font-bold"></div>
        </div>

        <!-- Close when clicking outside -->
        <form method="dialog" class="modal-backdrop backdrop-blur-xs">
            <button type="submit" aria-label="Close">Close</button>
        </form>
    </dialog>

    <!-- SUPPORT MODAL -->
    <dialog id="support-modal" class="modal">
        <div class="modal-box">
            <!-- Close button -->
            <form method="dialog">
                <button type="submit" class="btn btn-sm btn-circle absolute right-2 top-2" aria-label="Close">
                    <i class="bi bi-x-lg text-[#ff8d28]"></i>
                </button>
            </form>

            <!-- SUPPORT CONTENT -->
            <div id="support-content" class="[&_h1]:font-bold"></div>
        </div>

        <!-- Close when clicking outside -->
        <form method="dialog" class="modal-backdrop backdrop-blur-xs">
            <button type="submit" aria-label="Close">Close</button>
        </form>
    </dialog>
</body>

</html>
